services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: weathero
      POSTGRES_PASSWORD: weathero
      POSTGRES_DB: weathero
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weathero -d weathero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
